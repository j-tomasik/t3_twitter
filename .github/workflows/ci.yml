name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Step 1: Type check & unit tests ────────────────────────────────────────
  test:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  # ── Step 2: Augment analyzes changed files & generates tests ───────────────
  augment-tests:
    name: Augment — Analyze & Generate Tests
    runs-on: ubuntu-latest
    needs: test  # only runs if type check + unit tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so Augment can diff changed files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Augment to analyze changes and generate tests
        uses: augmentcode/augment-action@v1   # official Augment GitHub Action
        with:
          augment-api-key: ${{ secrets.AUGMENT_API_KEY }}
          task: |
            Analyze the files changed in this pull request.
            For any changed file that has no corresponding test coverage,
            generate new Vitest tests in src/test/ following the existing
            conventions in that folder. Then run `npm test` and confirm
            all tests pass.

      - name: Run full test suite (including any newly generated tests)
        run: npm test

  # ── Step 3: Production build check ────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: augment-tests  # only runs after Augment tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

